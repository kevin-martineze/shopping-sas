<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    El favicon del brandkit: solo la G, sin esfera. Por debajo de 32 px la
    esfera y los meridianos se cierran y ensucian el ícono, así que el kit
    reserva esta variante para los tamaños de pestaña.
  -->
  <defs>
    <linearGradient id="fondo" x1="0.12" y1="0.1" x2="0.88" y2="0.9">
      <stop offset="0" stop-color="#2B807C" />
      <stop offset="1" stop-color="#1C5C67" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#fondo)" />
  <g transform="translate(4 4) scale(0.2)">
    <path d="M 98,22 C 80,41 62,52 50,66 C 36,83 45,100 63,99 C 80,98 90,88 92,76" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" transform="translate(-5.5,1)" />
    <g fill="#fff" transform="translate(-5.5,1)">
      <polygon points="0,-13 18,0 0,13" transform="translate(97,23) rotate(-45)" />
      <polygon points="0,-13 18,0 0,13" transform="translate(91.5,76) rotate(-75)" />
    </g>
  </g>
</svg>
